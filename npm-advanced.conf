gzip on;
gzip_vary on;
gzip_min_length 1000;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/xml application/json application/javascript text/javascript image/svg+xml;

set $seerr_notice_connection "";
if ($http_upgrade != "") {
    set $seerr_notice_connection upgrade;
}

location = /__seerr_announcement.json {
    alias /data/nginx/custom/seerr_announcements.json;
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /__seerr_notice.js {
    alias /data/nginx/custom/seerr_notice.js;
    default_type application/javascript;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location / {
    proxy_pass $forward_scheme://$server:$port;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $seerr_notice_connection;
    proxy_set_header Accept-Encoding "";

    proxy_cache off;
    sub_filter_once on;
    sub_filter '</head>' '<script defer src="/__seerr_notice.js"></script></head>';
}